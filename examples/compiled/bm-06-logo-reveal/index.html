<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Logo Sting</title>
  <meta name="viewport" content="width=1920, height=1080">
  <!-- GSAP Core -->
  <script src="../../../node_modules/gsap/dist/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #07090e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
      -webkit-font-smoothing: antialiased;
    }

    .composition-root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .ambient-glow-layer {
      position: absolute;
      width: 1344px;
      height: 1344px;
      border-radius: 50%;
      background: radial-gradient(circle, #4f46e544 0%, #06b6d422 45%, transparent 70%);
      filter: blur(80px);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 80px 80px;
      z-index: 2;
    }

    #canvas-3d-container {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      z-index: 5;
      pointer-events: none;
    }

    .hf-track {
      position: relative;
      width: 100%;
    }

    
      #accent-brackets {
        position: absolute;
        inset: 40px;
        pointer-events: none;
        z-index: 10;
      }
      #accent-brackets .bracket {
        position: absolute;
        width: 32px;
        height: 32px;
        border-color: #06b6d4;
        border-style: solid;
        border-width: 0;
        opacity: 0.6;
      }
      #accent-brackets .top-left { top: 0; left: 0; border-top-width: 2px; border-left-width: 2px; }
      #accent-brackets .top-right { top: 0; right: 0; border-top-width: 2px; border-right-width: 2px; }
      #accent-brackets .bottom-left { bottom: 0; left: 0; border-bottom-width: 2px; border-left-width: 2px; }
      #accent-brackets .bottom-right { bottom: 0; right: 0; border-bottom-width: 2px; border-right-width: 2px; }
    

      #hero-logo {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 24px;
        position: relative;
        z-index: 22;
      }
      #hero-logo .logo-path {
        fill: none;
        stroke: #38bdf8;
        stroke-width: 4;
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
      }
      #hero-logo .logo-inner {
        fill: none;
        stroke: #4f46e5;
        stroke-width: 3;
        stroke-dasharray: 200;
        stroke-dashoffset: 200;
      }
    

      #brand-name {
        position: relative;
        z-index: 15;
        width: 100%;
        display: flex;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #f8fafc;
      }
      #brand-name .text-content {
        font-size: 56px;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.03em;
      }
      #brand-name .word-mask {
        display: inline-block;
        overflow: hidden;
        vertical-align: top;
        margin: 0 6px;
      }
      #brand-name .word-el {
        display: inline-block;
        transform-origin: bottom left;
      }
      #brand-name .gradient-accent {
        background: linear-gradient(135deg, #ffffff 30%, #38bdf8 75%, #4f46e5 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    
  </style>
</head>
<body>
  <div 
    id="root" 
    class="composition-root"
    data-composition-id="bm-06-logo-reveal"
    data-start="0"
    data-duration="3"
    data-width="1920"
    data-height="1080"
  >
    <div class="ambient-glow-layer" id="ambientGlow"></div>
    <div class="grid-overlay"></div>
    

    <div class="content-wrapper" style="position: relative; z-index: 15; width: 100%; display: flex; flex-direction: column; align-items: center; padding: 40px;">
      
        <!-- Component Track 1: ShapeReveal (accent-brackets) -->
        <div class="hf-track" data-track-index="1" data-start="0" data-duration="1">
          
      <div id="accent-brackets" class="comp-shape-reveal">
        <div class="bracket top-left"></div>
        <div class="bracket top-right"></div>
        <div class="bracket bottom-left"></div>
        <div class="bracket bottom-right"></div>
      </div>
    
        </div>
      

        <!-- Component Track 2: LogoReveal (hero-logo) -->
        <div class="hf-track" data-track-index="2" data-start="0.2" data-duration="1.4">
          
      <div id="hero-logo" class="comp-logo-reveal">
        <svg class="logo-svg" viewBox="0 0 100 100" style="width: 84px; height: 84px;">
          <polygon class="logo-path" points="50 5, 90 27.5, 90 72.5, 50 95, 10 72.5, 10 27.5" />
          <polyline class="logo-inner" points="50 25, 70 37.5, 70 62.5, 50 75, 30 62.5, 30 37.5 50 25" />
        </svg>
      </div>
    
        </div>
      

        <!-- Component Track 3: TextReveal (brand-name) -->
        <div class="hf-track" data-track-index="3" data-start="0.9" data-duration="1">
          
      <div id="brand-name" class="comp-text-reveal headline">
        <h1 class="text-content" style="text-align: center; max-width: 1200px;">
          <span class="word-mask"><span class="word-el gradient-accent">MOTION</span></span> <span class="word-mask"><span class="word-el gradient-accent">STUDIO</span></span>
        </h1>
      </div>
    
        </div>
      
    </div>
  </div>

  

  <script type="module">
    import { globalComponentRegistry } from '../../../src/components/registry.js';

    const tokens = {"colors":{"background":"#07090e","surface":"rgba(255, 255, 255, 0.04)","surfaceBorder":"rgba(255, 255, 255, 0.1)","textPrimary":"#f8fafc","textSecondary":"#94a3b8","textMuted":"#64748b","primary":"#4f46e5","accent":"#06b6d4","highlight":"#38bdf8","success":"#10b981","warning":"#f59e0b","danger":"#ef4444"},"typography":{"fontDisplay":"-apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif","fontBody":"-apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif","fontMono":"ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace","sizeHero":"76px","sizeHeadline":"56px","sizeTitle":"36px","sizeBody":"20px","sizeCaption":"14px","weightHero":"800","weightHeadline":"700","weightTitle":"600","weightBody":"400","weightCaption":"500","letterSpacingHero":"-0.03em","letterSpacingHeadline":"-0.02em","letterSpacingTitle":"-0.01em","letterSpacingCaption":"0.12em"},"surfaces":{"glassBlur":"16px","glassBg":"rgba(255, 255, 255, 0.03)","glassBorder":"1px solid rgba(255, 255, 255, 0.12)","radiusSm":"8px","radiusMd":"16px","radiusLg":"24px","radiusFull":"9999px","shadowElevated":"0 20px 40px -15px rgba(0, 0, 0, 0.5)","glowCyan":"0 0 30px rgba(6, 182, 212, 0.3)","glowIndigo":"0 0 40px rgba(79, 70, 229, 0.35)"},"motion":{"durationMicro":0.25,"durationShort":0.5,"durationMedium":0.8,"durationLong":1.2,"durationCinematic":2,"easeDecel":"power3.out","easeAccel":"power3.in","easeSmooth":"power2.inOut","easeDramatic":"expo.out","easeSnappy":"back.out(1.4)","staggerFast":0.04,"staggerMedium":0.08,"staggerRelaxed":0.12},"lighting":{"ambientColor":"#0a101d","ambientIntensity":2,"keyColor":"#ffffff","keyIntensity":4,"fillColor":"#06b6d4","fillIntensity":5,"rimColor":"#6366f1","rimIntensity":7},"camera":{"fov":45,"near":0.1,"far":100,"defaultStyle":"cinematic-orbit"},"preset":"modern-saas"};
    const tl = gsap.timeline({ paused: true });

    // Ambient background entrance
    tl.fromTo('#ambientGlow', 
      { scale: 0.9, opacity: 0.5 },
      { scale: 1.25, opacity: 0.85, duration: 2.7, ease: 'sine.out' },
      0.0
    );

    // Injected component GSAP builders
    
        (function() {
          const comp = globalComponentRegistry.get('ShapeReveal');
          if (comp && comp.buildGSAP) {
            comp.buildGSAP(tl, 'accent-brackets', {"start":0,"duration":1}, {"pattern":"corner-brackets","color":"#06b6d4"}, {}, tokens);
          }
        })();
      

        (function() {
          const comp = globalComponentRegistry.get('LogoReveal');
          if (comp && comp.buildGSAP) {
            comp.buildGSAP(tl, 'hero-logo', {"start":0.2,"duration":1.4}, {"size":84,"markType":"hexagon","color":"#38bdf8"}, {}, tokens);
          }
        })();
      

        (function() {
          const comp = globalComponentRegistry.get('TextReveal');
          if (comp && comp.buildGSAP) {
            comp.buildGSAP(tl, 'brand-name', {"start":0.9,"duration":1}, {"text":"MOTION STUDIO","variant":"headline","gradient":true,"splitBy":"words","align":"center","maxWidth":"1200px","stagger":0.08,"ease":"power4.out","depthAngle":-35}, {}, tokens);
          }
        })();
      

    // HyperFrames and Universal Seek Hooks
    window.__timelines = window.__timelines || {};
    window.__timelines['main'] = tl;
    window.__timelines['bm-06-logo-reveal'] = tl;

    window.renderFrame = function(timeInSeconds, frameIndex) {
      tl.seek(timeInSeconds, false);
      if (window.__threeRender) {
        window.__threeRender(timeInSeconds, frameIndex);
      }
      return true;
    };

    // Auto-preview loop in standard browser window
    if (!window.navigator.userAgent.includes('HeadlessChrome')) {
      let startTime = null;
      function previewLoop(now) {
        if (!startTime) startTime = now;
        const elapsed = ((now - startTime) / 1000) % 3;
        window.renderFrame(elapsed, Math.round(elapsed * 60));
        requestAnimationFrame(previewLoop);
      }
      requestAnimationFrame(previewLoop);
    }
  </script>
</body>
</html>
