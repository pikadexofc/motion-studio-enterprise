<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Variant 1: Cyber Neon</title>
  <meta name="viewport" content="width=1920, height=1080">
  <!-- GSAP Core -->
  <script src="../../../node_modules/gsap/dist/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #050508;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }

    .composition-root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .ambient-glow-layer {
      position: absolute;
      width: 1344px;
      height: 1344px;
      border-radius: 50%;
      background: radial-gradient(circle, #ec489944 0%, #00f0ff22 45%, transparent 70%);
      filter: blur(80px);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 80px 80px;
      z-index: 2;
    }

    #canvas-3d-container {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      z-index: 5;
      pointer-events: none;
    }

    .hf-track {
      position: relative;
      width: 100%;
    }

    
      #badge {
        display: flex;
        justify-content: center;
        margin-bottom: 24px;
        position: relative;
        z-index: 20;
      }
      #badge .badge-inner {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 20px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(16px);
      }
      #badge .badge-icon-svg {
        width: 22px;
        height: 22px;
      }
      #badge .badge-label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #f43f5e;
      }
    

      #headline {
        position: relative;
        z-index: 15;
        width: 100%;
        display: flex;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #ffffff;
      }
      #headline .text-content {
        font-size: 76px;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.03em;
      }
      #headline .word-mask {
        display: inline-block;
        overflow: hidden;
        vertical-align: top;
        margin: 0 6px;
      }
      #headline .word-el {
        display: inline-block;
        transform-origin: bottom left;
      }
      #headline .gradient-accent {
        background: linear-gradient(135deg, #ffffff 30%, #f43f5e 75%, #ec4899 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    
  </style>
</head>
<body>
  <div 
    id="root" 
    class="composition-root"
    data-composition-id="var-01-cyber-neon"
    data-start="0"
    data-duration="3"
    data-width="1920"
    data-height="1080"
  >
    <div class="ambient-glow-layer" id="ambientGlow"></div>
    <div class="grid-overlay"></div>
    <div id="canvas-3d-container"></div>

    <div class="content-wrapper" style="position: relative; z-index: 15; width: 100%; display: flex; flex-direction: column; align-items: center; padding: 40px;">
      
        <!-- Component Track 1: BrandBadge (badge) -->
        <div class="hf-track" data-track-index="1" data-start="0.1" data-duration="0.7">
          
      <div id="badge" class="comp-brand-badge">
        <div class="badge-inner">
          
      <svg class="badge-icon-svg" viewBox="0 0 24 24" fill="none" stroke="#00f0ff" stroke-width="2.5">
        <polygon points="12 2 2 7 12 12 22 7 12 2" />
        <polyline points="2 17 12 22 22 17" />
        <polyline points="2 12 12 17 22 12" />
      </svg>
    
          <span class="badge-label">CYBER EDGE</span>
        </div>
      </div>
    
        </div>
      

        <!-- Component Track 2: TextReveal (headline) -->
        <div class="hf-track" data-track-index="2" data-start="0.3" data-duration="1.2">
          
      <div id="headline" class="comp-text-reveal hero">
        <h1 class="text-content" style="text-align: center; max-width: 1200px;">
          <span class="word-mask"><span class="word-el">High</span></span> <span class="word-mask"><span class="word-el">Velocity</span></span> <span class="word-mask"><span class="word-el gradient-accent">Real-Time</span></span> <span class="word-mask"><span class="word-el gradient-accent">Computing</span></span>
        </h1>
      </div>
    
        </div>
      
    </div>
  </div>

  <script type="module">
        import * as THREE from '../../../node_modules/three/build/three.module.js';
        import { globalComponentRegistry } from '../../../src/components/registry.js';
        import { createPRNG } from '../../../src/engine/prng.js';

        const canvasContainer = document.getElementById('canvas-3d-container');
        const scene = new THREE.Scene();

        canvasContainer.appendChild(renderer.domElement);

        const prng = createPRNG(1001);

          // 3D Component: LightingRig (lights)
          (function() {
            const comp = globalComponentRegistry.get('LightingRig');
            if (comp && comp.buildThree) {
              const hook = comp.buildThree(THREE, scene, camera, renderer, 'lights', {"start":0,"duration":3}, {"ambientColor":659485,"ambientIntensity":2,"keyColor":16777215,"keyIntensity":4,"fillColor":61695,"fillIntensity":5,"rimColor":15485081,"rimIntensity":7,"orbitLights":true}, {}, tokens, prng);
              if (hook && hook.update) updateHooks.push(hook.update);
            }
          })();
        

          // 3D Component: OrbitalCamera (cam)
          (function() {
            const comp = globalComponentRegistry.get('OrbitalCamera');
            if (comp && comp.buildThree) {
              const hook = comp.buildThree(THREE, scene, camera, renderer, 'cam', {"start":0,"duration":3}, {"orbitSpeed":0.45,"orbitRadiusX":4.2,"orbitRadiusY":0.6,"initialZ":5,"zAdvanceSpeed":0.25,"targetY":0.3,"fov":45}, {}, tokens, prng);
              if (hook && hook.update) updateHooks.push(hook.update);
            }
          })();
        

          // 3D Component: ProceduralArtifact (artifact)
          (function() {
            const comp = globalComponentRegistry.get('ProceduralArtifact');
            if (comp && comp.buildThree) {
              const hook = comp.buildThree(THREE, scene, camera, renderer, 'artifact', {"start":0,"duration":3}, {"outerShape":"octahedron","outerRadius":1.4,"innerRadius":0.7,"roughness":0.1,"transmission":0.9,"ior":1.45,"glassColor":6333946,"coreColor":3718648,"ring1Color":8490232,"ring2Color":2282478,"floatSpeed":2.2,"floatAmp":0.15,"rotationSpeedX":0.8,"rotationSpeedY":0.6}, {}, tokens, prng);
              if (hook && hook.update) updateHooks.push(hook.update);
            }
          })();
        

        window.__threeRender = function(time, frameIndex) {
          for (let i = 0; i < updateHooks.length; i++) {
            updateHooks[i](time, frameIndex);
          }
          renderer.render(scene, camera);
        };
      </script>

  <script type="module">
    import { globalComponentRegistry } from '../../../src/components/registry.js';

    const tl = gsap.timeline({ paused: true });

    // Ambient background entrance
    tl.fromTo('#ambientGlow', 
      { scale: 0.9, opacity: 0.5 },
      { scale: 1.25, opacity: 0.85, duration: 2.7, ease: 'sine.out' },
      0.0
    );

    // Injected component GSAP builders
    
        (function() {
          const comp = globalComponentRegistry.get('BrandBadge');
          if (comp && comp.buildGSAP) {
            comp.buildGSAP(tl, 'badge', {"start":0.1,"duration":0.7}, {"text":"CYBER EDGE","icon":"diamond","accentColor":"#00f0ff"}, {}, tokens);
          }
        })();
      

        (function() {
          const comp = globalComponentRegistry.get('TextReveal');
          if (comp && comp.buildGSAP) {
            comp.buildGSAP(tl, 'headline', {"start":0.3,"duration":1.2}, {"text":"High Velocity Real-Time Computing","variant":"hero","gradient":true,"splitBy":"words","align":"center","maxWidth":"1200px","stagger":0.08,"ease":"power4.out","depthAngle":-35}, {"intensity":"energetic","ease":"expo.out"}, tokens);

        })();
      

    // HyperFrames and Universal Seek Hooks
    window.__timelines = window.__timelines || {};
    window.__timelines['main'] = tl;
    window.__timelines['var-01-cyber-neon'] = tl;

    window.renderFrame = function(timeInSeconds, frameIndex) {
      tl.seek(timeInSeconds, false);
      if (window.__threeRender) {
        window.__threeRender(timeInSeconds, frameIndex);
      }
      return true;
    };

    // Auto-preview loop in standard browser window
    if (!window.navigator.userAgent.includes('HeadlessChrome')) {
      let startTime = null;
      function previewLoop(now) {
        if (!startTime) startTime = now;
        const elapsed = ((now - startTime) / 1000) % 3;
        window.renderFrame(elapsed, Math.round(elapsed * 60));
        requestAnimationFrame(previewLoop);
      }
      requestAnimationFrame(previewLoop);
    }
