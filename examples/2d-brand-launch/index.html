<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Motion Studio — 2D Brand Launch</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #07090e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #f8fafc;
      -webkit-font-smoothing: antialiased;
    }

    .viewport {
      position: relative;
      width: 1920px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Ambient dynamic background */
    .ambient-glow {
      position: absolute;
      width: 1200px;
      height: 1200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(79, 70, 229, 0.25) 0%, rgba(6, 182, 212, 0.1) 40%, rgba(7, 9, 14, 0) 70%);
      filter: blur(80px);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
    }

    .grid-pattern {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 80px 80px;
      z-index: 2;
    }

    /* Staging container */
    .content-stage {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 1400px;
      padding: 0 40px;
    }

    /* Brand Badge */
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 10px 24px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      margin-bottom: 40px;
      transform-origin: center center;
    }

    .badge-icon {
      width: 28px;
      height: 28px;
    }

    .badge-text {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #67e8f9;
    }

    /* Kinetic Headline */
    .headline {
      font-size: 84px;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 28px;
      max-width: 1250px;
    }

    .word-mask {
      display: inline-block;
      overflow: hidden;
      vertical-align: top;
      margin: 0 6px;
    }

    .word {
      display: inline-block;
      transform-origin: bottom left;
    }

    .gradient-text {
      background: linear-gradient(135deg, #ffffff 30%, #38bdf8 80%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Subtitle copy */
    .subtitle {
      font-size: 26px;
      line-height: 1.5;
      color: #94a3b8;
      max-width: 820px;
      margin-bottom: 50px;
      font-weight: 400;
    }

    /* Feature Pills / Metrics */
    .metrics-row {
      display: flex;
      gap: 24px;
      justify-content: center;
    }

    .metric-card {
      padding: 18px 36px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 220px;
    }

    .metric-val {
      font-size: 32px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 4px;
    }

    .metric-label {
      font-size: 14px;
      color: #64748b;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Accent vector lines */
    .vector-accents {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    .accent-path {
      fill: none;
      stroke: url(#accentGradient);
      stroke-width: 2;
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
    }
  </style>
  <!-- Load local GSAP from node_modules -->
  <script src="../../node_modules/gsap/dist/gsap.min.js"></script>
</head>
<body>
  <div class="viewport">
    <div class="ambient-glow" id="glow"></div>
    <div class="grid-pattern"></div>

    <svg class="vector-accents" viewBox="0 0 1920 1080">
      <defs>
        <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.8" />
          <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
        </linearGradient>
      </defs>
      <path id="pathLeft" class="accent-path" d="M 120 200 L 340 200 L 440 300" />
      <path id="pathRight" class="accent-path" d="M 1800 880 L 1580 880 L 1480 780" />
    </svg>

    <div class="content-stage">
      <div class="brand-badge" id="brandBadge">
        <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2.5">
          <polygon points="12 2 2 7 12 12 22 7 12 2" />
          <polyline points="2 17 12 22 22 17" />
          <polyline points="2 12 12 17 22 12" />
        </svg>
        <span class="badge-text">Motion Studio 1.0</span>
      </div>

      <h1 class="headline" id="headline">
        <span class="word-mask"><span class="word">Deterministic</span></span>
        <span class="word-mask"><span class="word">Motion</span></span>
        <span class="word-mask"><span class="word">Synthesis</span></span>
        <span class="word-mask"><span class="word">for</span></span>
        <span class="word-mask"><span class="word gradient-text">Autonomous</span></span>
        <span class="word-mask"><span class="word gradient-text">Creatives</span></span>
      </h1>

      <p class="subtitle" id="subtitle">
        Transform high-level natural language briefs into frame-accurate, professional motion graphics rendered directly from web primitives.
      </p>

      <div class="metrics-row" id="metricsRow">
        <div class="metric-card">
          <div class="metric-val">60 FPS</div>
          <div class="metric-label">Zero Frame Drops</div>
        </div>
        <div class="metric-card">
          <div class="metric-val">0.0 ms</div>
          <div class="metric-label">Clock Drift</div>
        </div>
        <div class="metric-card">
          <div class="metric-val">100%</div>
          <div class="metric-label">Reproducible</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Build paused GSAP timeline
    const tl = gsap.timeline({ paused: true });

    // 0. Ambient glow breathing & vector lines
    tl.fromTo('#glow', 
      { scale: 0.9, opacity: 0.5 },
      { scale: 1.25, opacity: 0.8, duration: 2.8, ease: 'sine.out' },
      0.0
    );

    tl.to('#pathLeft, #pathRight', {
      strokeDashoffset: 0,
      duration: 1.6,
      ease: 'power2.inOut'
    }, 0.1);

    // 1. Brand Badge Entrance
    tl.from('#brandBadge', {
      scale: 0.7,
      y: -30,
      opacity: 0,
      duration: 0.8,
      ease: 'back.out(1.4)'
    }, 0.1);

    // 2. Kinetic Headline Words Stagger
    tl.from('.word', {
      y: 90,
      opacity: 0,
      rotateX: -35,
      stagger: 0.08,
      duration: 1.1,
      ease: 'power4.out'
    }, 0.3);

    // 3. Subtitle Entrance
    tl.from('#subtitle', {
      y: 25,
      opacity: 0,
      duration: 0.9,
      ease: 'power3.out'
    }, 0.9);

    // 4. Metric Cards Staggered Pop
    tl.from('.metric-card', {
      y: 40,
      opacity: 0,
      scale: 0.92,
      stagger: 0.12,
      duration: 0.8,
      ease: 'power3.out'
    }, 1.2);

    // Universal Deterministic Hook
    window.renderFrame = function(timeInSeconds, frameIndex) {
      tl.seek(timeInSeconds, false);
      return true;
    };

    // Auto-preview in browser if opened manually outside headless renderer
    if (!window.navigator.userAgent.includes('HeadlessChrome')) {
      let startTime = null;
      function previewLoop(now) {
        if (!startTime) startTime = now;
        const elapsed = ((now - startTime) / 1000) % 3.0;
        window.renderFrame(elapsed);
        requestAnimationFrame(previewLoop);
      }
      requestAnimationFrame(previewLoop);
    }
  </script>
</body>
</html>
