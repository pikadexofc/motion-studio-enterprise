<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Motion Studio — 3D Procedural Stage</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #050608;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
      -webkit-font-smoothing: antialiased;
    }

    #canvas-container {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      z-index: 1;
    }

    /* UI Overlay Layer */
    .ui-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px 80px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-tag {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-tag::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 12px #38bdf8;
    }

    .stage-id {
      font-family: monospace;
      font-size: 14px;
      color: #64748b;
      letter-spacing: 0.1em;
    }

    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .hero-title {
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
      max-width: 800px;
      background: linear-gradient(180deg, #ffffff 40%, rgba(255, 255, 255, 0.6) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-sub {
      font-size: 20px;
      color: #94a3b8;
      margin-top: 12px;
      font-weight: 400;
    }

    .spec-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px 24px;
      backdrop-filter: blur(12px);
      text-align: right;
    }

    .spec-value {
      font-size: 22px;
      font-weight: 700;
      color: #f8fafc;
    }

    .spec-label {
      font-size: 12px;
      letter-spacing: 0.1em;
      color: #64748b;
      text-transform: uppercase;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="ui-overlay">
    <div class="top-bar">
      <div class="brand-tag">Motion Studio // 3D Procedural Engine</div>
      <div class="stage-id">STAGE: KIN-STAGE-04 // SEED: 4289</div>
    </div>

    <div class="bottom-bar">
      <div>
        <h1 class="hero-title">Spatial Glassmorphism & Depth Geometry</h1>
        <p class="hero-sub">Procedural WebGL scene driven by deterministic virtual time coordinates.</p>
      </div>
      <div class="spec-box">
        <div class="spec-value">60 FPS WEBGL</div>
        <div class="spec-label">Deterministic Render</div>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from '../../node_modules/three/build/three.module.js';

    // PRNG implementation (Mulberry32) for deterministic 3D particle positions
    function createPRNG(seed) {
      let s = Math.floor(Math.abs(seed)) || 1337;
      return function() {
        s |= 0; s = (s + 0x6d2b79f5) | 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const prng = createPRNG(4289);

    // Three.js Scene Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050608, 0.08);

    const camera = new THREE.PerspectiveCamera(45, 1920 / 1080, 0.1, 50);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(1920, 1080);
    renderer.setPixelRatio(1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    // Multi-Point Lighting Hierarchy
    const ambientLight = new THREE.AmbientLight(0x0a101d, 2.0);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 4.0);
    keyLight.position.set(5, 8, 5);
    scene.add(keyLight);

    const cyanFillLight = new THREE.PointLight(0x06b6d4, 6.0, 20);
    cyanFillLight.position.set(-5, 2, -2);
    scene.add(cyanFillLight);

    const indigoRimLight = new THREE.PointLight(0x6366f1, 8.0, 20);
    indigoRimLight.position.set(3, -2, -4);
    scene.add(indigoRimLight);

    // Reflective Circular Stage / Podium
    const stageGeo = new THREE.CylinderGeometry(3.5, 3.8, 0.3, 64);
    const stageMat = new THREE.MeshStandardMaterial({
      color: 0x0c0f17,
      roughness: 0.2,
      metalness: 0.8
    });
    const stageMesh = new THREE.Mesh(stageGeo, stageMat);
    stageMesh.position.y = -1.2;
    scene.add(stageMesh);

    // Glowing stage ring
    const ringGeo = new THREE.TorusGeometry(3.6, 0.04, 16, 100);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
    ringMesh.rotation.x = Math.PI / 2;
    ringMesh.position.y = -1.05;
    scene.add(ringMesh);

    // Central Hero: Procedural Icosahedron & Inner Core
    const heroGroup = new THREE.Group();
    scene.add(heroGroup);

    const outerGeo = new THREE.IcosahedronGeometry(1.4, 0);
    const outerMat = new THREE.MeshPhysicalMaterial({
      color: 0x60a5fa,
      roughness: 0.1,
      metalness: 0.1,
      transmission: 0.9,
      ior: 1.45,
      reflectivity: 0.9,
      transparent: true,
      opacity: 0.85
    });
    const outerMesh = new THREE.Mesh(outerGeo, outerMat);
    heroGroup.add(outerMesh);

    const innerGeo = new THREE.OctahedronGeometry(0.7, 0);
    const innerMat = new THREE.MeshStandardMaterial({
      color: 0x38bdf8,
      roughness: 0.15,
      metalness: 0.9,
      emissive: 0x0284c7,
      emissiveIntensity: 0.4
    });
    const innerMesh = new THREE.Mesh(innerGeo, innerMat);
    heroGroup.add(innerMesh);

    // Floating Orbital Torus Rings
    const orbitRingGeo1 = new THREE.TorusGeometry(2.1, 0.025, 16, 80);
    const orbitRingMat1 = new THREE.MeshStandardMaterial({ color: 0x818cf8, roughness: 0.3, metalness: 0.8 });
    const orbitRing1 = new THREE.Mesh(orbitRingGeo1, orbitRingMat1);
    heroGroup.add(orbitRing1);

    const orbitRingGeo2 = new THREE.TorusGeometry(2.5, 0.02, 16, 80);
    const orbitRingMat2 = new THREE.MeshStandardMaterial({ color: 0x22d3ee, roughness: 0.3, metalness: 0.8 });
    const orbitRing2 = new THREE.Mesh(orbitRingGeo2, orbitRingMat2);
    heroGroup.add(orbitRing2);

    // Deterministic Seeded Particle Cloud
    const particleCount = 180;
    const particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const baseRadii = new Float32Array(particleCount);
    const baseAngles = new Float32Array(particleCount);
    const baseHeights = new Float32Array(particleCount);

    for (let i = 0; i < particleCount; i++) {
      baseRadii[i] = 1.8 + prng() * 4.0;
      baseAngles[i] = prng() * Math.PI * 2;
      baseHeights[i] = -1.0 + prng() * 3.5;

      positions[i * 3] = Math.cos(baseAngles[i]) * baseRadii[i];
      positions[i * 3 + 1] = baseHeights[i];
      positions[i * 3 + 2] = Math.sin(baseAngles[i]) * baseRadii[i];
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particleMat = new THREE.PointsMaterial({
      color: 0x7dd3fc,
      size: 0.06,
      transparent: true,
      opacity: 0.75
    });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // Universal Deterministic Hook
    window.renderFrame = function(timeInSeconds, frameIndex) {
      const t = timeInSeconds;

      // 1. Camera trajectory (smooth cinematic drift)
      camera.position.x = Math.sin(t * 0.4) * 4.2;
      camera.position.y = 1.0 + Math.cos(t * 0.3) * 0.6;
      camera.position.z = 5.2 - t * 0.25;
      camera.lookAt(0, 0.3, 0);

      // 2. Hero rotation and floating hover
      heroGroup.position.y = 0.4 + Math.sin(t * 1.5) * 0.15;
      outerMesh.rotation.x = t * 0.45;
      outerMesh.rotation.y = t * 0.6;
      innerMesh.rotation.x = -t * 0.7;
      innerMesh.rotation.y = -t * 0.5;

      orbitRing1.rotation.x = t * 0.8;
      orbitRing1.rotation.y = t * 0.5;
      orbitRing2.rotation.x = -t * 0.6;
      orbitRing2.rotation.z = t * 0.4;

      // 3. Deterministic particle drift
      const posAttr = particleGeo.attributes.position;
      for (let i = 0; i < particleCount; i++) {
        const angle = baseAngles[i] + t * (0.15 + (i % 5) * 0.02);
        const r = baseRadii[i];
        const h = baseHeights[i] + Math.sin(t * 1.2 + i) * 0.2;
        posAttr.setXYZ(i, Math.cos(angle) * r, h, Math.sin(angle) * r);
      }
      posAttr.needsUpdate = true;

      // 4. Lights orbital pulsation
      cyanFillLight.position.x = Math.sin(t) * 6;
      cyanFillLight.position.z = Math.cos(t) * 6;

      // 5. Synchronous WebGL render pass
      renderer.render(scene, camera);
      return true;
    };

    // Auto-preview in browser if opened manually outside headless renderer
    if (!window.navigator.userAgent.includes('HeadlessChrome')) {
      let startTime = null;
      function previewLoop(now) {
        if (!startTime) startTime = now;
        const elapsed = ((now - startTime) / 1000) % 3.0;
        window.renderFrame(elapsed);
        requestAnimationFrame(previewLoop);
      }
      requestAnimationFrame(previewLoop);
    }
  </script>
</body>
</html>
